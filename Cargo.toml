[workspace]
resolver = "2"
members = [
    "crates/tyxel-core",
    "crates/tyxel-enc",
    "crates/tyxel-play",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tyxel Project"]

[workspace.dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
unicode-width = "0.2"

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
