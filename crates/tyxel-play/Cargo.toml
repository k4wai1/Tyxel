[package]
name = "tyxel-play"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tyxel TUI player CLI: tyxel cat, tyxel export, tyxel play, tyxel info"

[dependencies]
tyxel-core = { path = "../tyxel-core" }
clap = { version = "4", features = ["derive"] }
termios = "0.3.2"
libc = "0.2.174"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }